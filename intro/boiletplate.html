<!DOCTYPE html>
<!-- Tells the browser that we are using modern HTML5. Helps the browser render the page in standards mode-->

<!-- The html tag is the root element of the entire HTML document.lang="en" specifies that the webpage's primary language is English -->
<html lang="en">

<!-- The head section contains metadata and information about the webpage. -->
<head>
    <!-- Specifies UTF 8 character encoding to support different languages,symbols and emojis. -->
    <meta charset="UTF-8">

    <!-- helps the webpage display properly on different devices
         width=device-width sets the viewport width to the device width
         initial-scale=1.0 sets the initial zoom level to 100% -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- defines the webpage title displayed in the browser tab -->
    <title>Document</title>

</head>

<!-- the body contains the main content visible on the webpage,
     such as headings, paragraphs, images, links, buttons etc... -->
<body>

</body>

<!-- closes the root HTML element and marks the end of the document -->
</html>
